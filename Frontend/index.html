<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Emberlight Chatbot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="chat-container">
    <h1>Emberlight · Chaizing Fireflies</h1>

    <div id="chat-window" class="chat-window"></div>

    <div class="input-row">
      <input
        id="user-input"
        type="text"
        placeholder="Ask Emberlight about remedies, scents, or products..."
      />
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
